services:
  # -------------------------------------------------------------
  # MindHue Django REST API Web Service on Render
  # -------------------------------------------------------------
  - type: web
    name: mindhue-backend
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: mindhue-postgres
          property: connectionString

# -------------------------------------------------------------
# Managed PostgreSQL Database on Render (Optional / Recommended)
# -------------------------------------------------------------
databases:
  - name: mindhue-postgres
    plan: free
    region: oregon
    databaseName: mindhue_db
    user: mindhue_user
